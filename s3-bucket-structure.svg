<svg width='1628' height='928' viewBox='0 0 1628 928' role='img' aria-labelledby='title desc' xmlns='http://www.w3.org/2000/svg'> <title id='title'>Amazon S3 bucket structure for im2-yaoki-rover</title> <desc id='desc'>Diagram showing an Amazon S3 bucket in the Tokyo AWS region with three top-level folders: images, timeseries, and yamcs-data, including example files and subfolders.</desc> <defs id='defs4'> <linearGradient id='folderGrad' x1='0' y1='0' x2='0' y2='1'> <stop offset='0%' stop-color='#f7b821' id='stop1' /> <stop offset='100%' stop-color='#ffd675' id='stop2' /> </linearGradient> <linearGradient id='bucketGrad' x1='0' y1='0' x2='1' y2='1'> <stop offset='0%' stop-color='#4a9c31' id='stop3' /> <stop offset='100%' stop-color='#73b84f' id='stop4' /> </linearGradient> <style id='style4'> .navy { fill:#0b2f63; } .blue-stroke { stroke:#2f6ecb; } .navy-stroke { stroke:#0b2f63; } .body { font-family:Arial, Helvetica, sans-serif; fill:#223e68; } .title { font-family:Arial, Helvetica, sans-serif; font-weight:700; fill:#0b2f63; } .small { font-size:22px; } .medium { font-size:28px; } .large { font-size:36px; } .bucket-name { font-size:53px; font-weight:700; fill:#4f9137; } .italic { font-style:italic; } .outline { fill:#fff; stroke:#4a84d4; stroke-width:2.5; } </style> </defs> <rect width='1628' height='928' fill='#ffffff' id='rect4' /> <!-- Bucket header --> <g id='bucket-header'> <rect x='423' y='39' width='718' height='204' rx='20' fill='#fff' stroke='#0b2f63' stroke-width='4' stroke-dasharray='11 10' id='rect5' /> <rect x='492' y='73' width='134' height='137' rx='12' fill='url(#bucketGrad)' id='rect6' /> <!-- S3 bucket icon --> <g transform='translate(513 87)' fill='none' stroke='#fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' id='g8'> <ellipse cx='48' cy='16' rx='43' ry='14' id='ellipse6' /> <path d='M5 16 L11 90 Q48 108 85 90 L91 16' id='path6' /> <path d='M52 43 L84 59' id='path7' /> <circle cx='48' cy='41' r='4.5' fill='#fff' stroke='none' id='circle7' /> <circle cx='87' cy='61' r='4.5' fill='#fff' stroke='none' id='circle8' /> </g> <text x='660' y='103' class='title large' id='text8'>Amazon S3 Bucket</text> <text x='660' y='160' class='bucket-name' id='text9'>im2-yaoki-rover</text> <text x='660' y='208' class='body medium italic' id='text10'>Tokyo AWS Region</text> </g> <!-- Branch connector --> <g id='connectors' fill='none' stroke='#0b2f63' stroke-width='4'> <path d='M796 243 V313' id='path10' /> <path d='M237 313 H1289' id='path11' /> <path d='M237 313 V354' id='path12' /> <path d='M796 313 V354' id='path13' /> <path d='M1289 313 V354' id='path14' /> </g> <!-- Reusable folder symbol instances are drawn manually for maximum compatibility --> <!-- Left folder --> <g id='images-folder' transform='translate(96 365)'> <path d='M0 28 Q0 10 18 10 H57 L72 26 H132 Q150 26 150 44 V110 Q150 128 132 128 H18 Q0 128 0 110 Z' fill='url(#folderGrad)' id='path15' /> <path d='M0 39 H150' stroke='#e5a012' stroke-width='3' id='path16' /> <rect x='43' y='51' width='67' height='65' rx='8' fill='#fff' stroke='#0b2f63' stroke-width='4' id='rect16' /> <circle cx='65' cy='73' r='7' fill='#0b2f63' id='circle16' /> <path d='M50 106 L72 84 L85 96 L103 77 L103 108 Z' fill='#0b2f63' id='path17' /> </g> <text x='276' y='421' class='title medium' id='text17'>images/</text> <text x='276' y='456' class='body small' id='text18'>Mission Images and</text> <text x='276' y='489' class='body small' id='text19'>Derived Products</text> <path d='M169 504 V551' stroke='#0b2f63' stroke-width='4' id='path19' /> <!-- Center folder --> <g id='timeseries-folder' transform='translate(594 365)'> <path d='M0 28 Q0 10 18 10 H57 L72 26 H132 Q150 26 150 44 V110 Q150 128 132 128 H18 Q0 128 0 110 Z' fill='url(#folderGrad)' id='path20' /> <path d='M0 39 H150' stroke='#e5a012' stroke-width='3' id='path21' /> <g fill='none' stroke='#0b2f63' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' id='g29' transform='translate(0,18)'> <path d='M 45,98 V 76' id='path22' /> <path d='M 65,98 V 59' id='path23' /> <path d='M 85,98 V 70' id='path24' /> <path d='M 105,98 V 48' id='path25' /> <path d='M 43,67 65,49 84,59 103,38' id='path26' /> <circle cx='43' cy='67' r='4' fill='#ffffff' id='circle26' /> <circle cx='65' cy='49' r='4' fill='#ffffff' id='circle27' /> <circle cx='84' cy='59' r='4' fill='#ffffff' id='circle28' /> <circle cx='103' cy='38' r='4' fill='#ffffff' id='circle29' /> </g> </g> <text x='787' y='421' class='title medium' id='text29'>timeseries/</text> <text x='787' y='456' class='body small' id='text30'>Telemetry, Commands</text> <text x='787' y='489' class='body small' id='text31'>and Time Series Data</text> <path d='M663 504 V551' stroke='#0b2f63' stroke-width='4' id='path31' /> <!-- Right folder --> <g id='yamcs-folder' transform='translate(1132 365)'> <path d='M0 28 Q0 10 18 10 H57 L72 26 H132 Q150 26 150 44 V110 Q150 128 132 128 H18 Q0 128 0 110 Z' fill='url(#folderGrad)' id='path32' /> <path d='M0 39 H150' stroke='#e5a012' stroke-width='3' id='path33' /> <!-- Three distinct disk platters --> <g fill='#0b2f63' stroke='#ffffff' stroke-width='1.5' stroke-linejoin='round' id='g36' transform='translate(0,10)'> <!-- bottom platter --> <ellipse cx='77' cy='89' rx='29' ry='10' id='ellipse33' /> <path d='m 48,89 v 9 c 0,6 13,11 29,11 16,0 29,-5 29,-11 v -9 c 0,6 -13,11 -29,11 -16,0 -29,-5 -29,-11 z' id='path34' /> <!-- middle platter --> <ellipse cx='77' cy='70' rx='29' ry='10' id='ellipse34' /> <path d='m 48,70 v 9 c 0,6 13,11 29,11 16,0 29,-5 29,-11 V 70 C 106,76 93,81 77,81 61,81 48,76 48,70 Z' id='path35' /> <!-- top platter --> <ellipse cx='77' cy='51' rx='29' ry='10' id='ellipse35' /> <path d='m 48,51 v 9 c 0,6 13,11 29,11 16,0 29,-5 29,-11 V 51 C 106,57 93,62 77,62 61,62 48,57 48,51 Z' id='path36' /> </g> </g> <text x='1317' y='421' class='title medium' id='text36'>yamcs-data/</text> <text x='1317' y='456' class='body small' id='text37'>YAMCS Archive</text> <text x='1317' y='489' class='body small' id='text38'>Database Files</text> <path d='M1205 504 V551' stroke='#0b2f63' stroke-width='4' id='path38' /> <!-- Left contents --> <g id='images-box'> <rect x='76' y='551' width='410' height='320' rx='18' class='outline' id='rect38' /> <g transform='translate(105 582)' id='g42'> <g fill='#fff' stroke='#1767d4' stroke-width='3' id='g41'> <path d='M0 0 H23 L36 13 V36 H0 Z' id='path39' /> <path d='M23 0 V13 H36' id='path40' /> <path d='M7 28 L14 20 L19 25 L26 17 L31 28 Z' fill='#1767d4' stroke='none' id='path41' /> </g> <text x='58' y='28' class='body small' id='text41'>dimage_00000_00001.png</text> </g> <g transform='translate(105 646)' id='g45'> <g fill='#fff' stroke='#1767d4' stroke-width='3' id='g44'> <path d='M0 0 H23 L36 13 V36 H0 Z' id='path42' /> <path d='M23 0 V13 H36' id='path43' /> <path d='M7 28 L14 20 L19 25 L26 17 L31 28 Z' fill='#1767d4' stroke='none' id='path44' /> </g> <text x='58' y='28' class='body small' id='text44'>imager_00000_00002.png</text> </g> <g transform='translate(105 710)' id='g48'> <g fill='#fff' stroke='#1767d4' stroke-width='3' id='g47'> <path d='M0 0 H23 L36 13 V36 H0 Z' id='path45' /> <path d='M23 0 V13 H36' id='path46' /> <path d='M7 28 L14 20 L19 25 L26 17 L31 28 Z' fill='#1767d4' stroke='none' id='path47' /> </g> <text x='58' y='28' class='body small' id='text47'>imager_00000_00002.raw</text> </g> <text x='108' y='801' class='body medium' id='text48'>…</text> </g> <!-- Center contents --> <g id='timeseries-box'> <rect x='576' y='551' width='429' height='320' rx='18' class='outline' id='rect48' /> <!-- folder icon --> <g transform='translate(610 583)' id='g49'> <path d='M0 11 Q0 4 7 4 H21 L28 11 H42 Q49 11 49 18 V38 Q49 45 42 45 H7 Q0 45 0 38 Z' fill='#1767d4' id='path48' /> <path d='M1 14 H48' stroke='#fff' stroke-width='2' id='path49' /> <text x='67' y='31' class='body small' id='text49'>commands/</text> </g> <g transform='translate(610 641)' id='g51'> <path d='M0 11 Q0 4 7 4 H21 L28 11 H42 Q49 11 49 18 V38 Q49 45 42 45 H7 Q0